<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face{font-family:Cairo;src:url("../../../PILOTS/TSST-PILOT-002_VILL_STRATEGY_BASELINE/assets/fonts/cairo.ttf");font-weight:200 1000}
html,body{margin:0;width:1080px;height:1920px;background:#01304A;overflow:hidden}
.stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:48px;color:#fff;font-family:Cairo,sans-serif;font-weight:800}
.ar{font-size:220px;line-height:1.3}
.en{font-size:110px;direction:ltr;letter-spacing:.02em}
.clip{overflow:hidden;padding:20px 40px}
</style></head><body>
<div class="stage">
  <div class="clip"><div class="ar" id="ar">فيلا</div></div>
  <div class="clip"><div class="en" id="en">VILL</div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
// Whole word per element (never split Arabic per letter). Everything derives from tl.time(t).
gsap.ticker.lagSmoothing(0);
const tl = gsap.timeline({paused:true});
tl.fromTo('#ar',{yPercent:110,opacity:0},{yPercent:0,opacity:1,duration:1,ease:'expo.out'},0.3)
  .fromTo('#en',{yPercent:110,opacity:0},{yPercent:0,opacity:1,duration:0.8,ease:'power3.out'},0.8)
  .to('.stage',{opacity:0,duration:0.5,ease:'sine.inOut'},3.5);
window.seek = t => { tl.pause(); tl.time(t, false); };
window.seek(0);
</script></body></html>
