<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VILL Studio logo sting (concept A, light finds the mark)</title>
<style>
  html,body{margin:0;background:#011C2C;overflow:hidden}
  canvas{display:block}
</style>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<div style="display:none">
<img id="p_v_slab" src="parts/v_slab.png"><img id="p_i" src="parts/i.png"><img id="p_l1" src="parts/l1.png"><img id="p_l2" src="parts/l2.png"><img id="p_v_wedge" src="parts/v_wedge.png"><img id="p_studio" src="parts/studio.png">
</div>
<script>
/* VILL logo sting. STORYBOARD.md is the spec. Every pixel is a pure function of t (window.seek).
   No CSS animation, timers or rAF drive anything. Logo pixels are the 6 approved shapes cut by
   cut_parts.py from "Wordmark Dark Transparent.png" (never redrawn). */
const Q = new URLSearchParams(location.search);
let FW = 1080, FH = 1920;
if (Q.get('format')) { const m = Q.get('format').split('x'); FW = +m[0]; FH = +m[1]; }
else if (innerWidth && innerHeight) { FW = innerWidth; FH = innerHeight; }   // capture tool sets the viewport
const NATIVE = Q.get('native') === '1';                                      // QA: logo at 1:1, canvas = source frame

const BG = '#011C2C', POOL = '#01304A';
const DUR = 3.8, ANG = 19.26 * Math.PI / 180, C = Math.cos(ANG), S = Math.sin(ANG);
const FEATHER = 60;

/* bboxes from parts.json (inclusive px in the 1080x1080 source canvas) */
const PARTS = {
  v_slab: {b:[193,356,415,690]}, i:{b:[336,412,518,633]}, l1:{b:[460,412,720,633]}, l2:{b:[714,412,973,633]},
  v_wedge:{b:[106,463,233,673]}, studio:{b:[690,657,938,690]}
};
const LIGHT = ['v_slab','i','l1','l2'];
const LOGO_C = [540, 523];            // centre of the logo bbox in source px (868 x 335)

/* layout per format: same timeline, only these constants change */
let L;
if (NATIVE) L = {w:FW, h:FH, s:1, cx:LOGO_C[0], cy:LOGO_C[1], poolR:700};
else if (FW > FH) L = {w:FW, h:FH, s:900/868, cx:FW/2, cy:FH/2, poolR:1000};
else if (FW === FH) L = {w:FW, h:FH, s:760/868, cx:FW/2, cy:FH/2, poolR:700};
else L = {w:FW, h:FH, s:760/868, cx:FW/2, cy:900, poolR:820};

/* ---- cubic-bezier easings (ref/easing.md) ---- */
function bez(x1,y1,x2,y2){
  const cx=3*x1,bx=3*(x2-x1)-cx,ax=1-cx-bx, cy=3*y1,by=3*(y2-y1)-cy,ay=1-cy-by;
  const X=t=>((ax*t+bx)*t+cx)*t, Y=t=>((ay*t+by)*t+cy)*t, dX=t=>(3*ax*t+2*bx)*t+cx;
  return p=>{ if(p<=0)return 0; if(p>=1)return 1; let t=p;
    for(let i=0;i<8;i++){const e=X(t)-p; if(Math.abs(e)<1e-6)break; const d=dX(t); if(Math.abs(d)<1e-6)break; t-=e/d;}
    let lo=0,hi=1; if(t<0||t>1){t=p;for(let i=0;i<40;i++){X(t)<p?lo=t:hi=t;t=(lo+hi)/2;}}
    return Y(t); };
}
const E = {
  sineOut:  bez(.61,1,.88,1),
  quartIO:  bez(.76,0,.24,1),
  quartOut: bez(.25,1,.5,1),
  expoOut:  bez(.16,1,.3,1),
  cubicOut: bez(.33,1,.68,1),
  sineIO:   bez(.37,0,.63,1)
};
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));

/* ---- scene geometry ---- */
const proj=(x,y)=>x*C+y*S;                            // distance along sweep normal (edge leans like the logo slab, 19.26 deg)
const projM=(x,y)=>-x*S+y*C;                          // second edge direction, used for the wedge (top to bottom)
const gmin=proj(106,356), gmax=proj(973,690);
const E0=gmin-FEATHER+5, E1=gmax+FEATHER+30;                 // main sweep range: nothing shown -> everything shown

/* ---- timeline: proxy values only, DOM/canvas is drawn from them ---- */
const P = {pool:0, pscale:.92, edge:E0, wedge:0, studio:0, dim:0};
const tl = gsap.timeline({paused:true, defaults:{overwrite:false}});
tl.to(P,{pool:1, pscale:1, duration:.5, ease:E.sineOut},0)
  .to(P,{edge:E1, duration:1.2, ease:E.quartIO},.30)
  .to(P,{wedge:1, duration:.7, ease:E.expoOut},1.40)
  .to(P,{studio:1, duration:.6, ease:E.cubicOut},2.00)
  .to(P,{dim:1, duration:1.2, ease:E.sineIO},2.60)
  .set({}, {}, DUR);

/* ---- assets ---- */
const cv = document.getElementById('c'); cv.width = L.w; cv.height = L.h;
const ctx = cv.getContext('2d');
const tmp = document.createElement('canvas'); tmp.width = 1080; tmp.height = 1080;
const tctx = tmp.getContext('2d');
const IM = {}; const names = Object.keys(PARTS);
/* <img> tags in the DOM, so the page load event (awaited by capture) waits for the pixels */
names.forEach(n=>{ IM[n]=document.getElementById('p_'+n); });

/* static fine noise (seeded) against banding in the dark gradient */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const noise = document.createElement('canvas'); noise.width = noise.height = 256;
(function(){ const n=noise.getContext('2d'), d=n.createImageData(256,256), r=mulberry32(20261008);
  for(let i=0;i<d.data.length;i+=4){const v=r()*255|0; d.data[i]=d.data[i+1]=d.data[i+2]=v; d.data[i+3]=7;} n.putImageData(d,0,0); })();

/* draw one part into tmp (source space) with an optional masked reveal, then onto the main canvas */
function drawPart(name, dx, dy, alpha, maskFn){
  tctx.setTransform(1,0,0,1,0,0); tctx.globalCompositeOperation='source-over'; tctx.clearRect(0,0,1080,1080);
  tctx.drawImage(IM[name], dx, dy);
  if (maskFn){ tctx.globalCompositeOperation='destination-in'; maskFn(tctx); tctx.globalCompositeOperation='source-over'; }
  ctx.globalAlpha = alpha; ctx.drawImage(tmp,0,0); ctx.globalAlpha = 1;
}
/* linear alpha ramp along direction (nx,ny): alpha 0 where p.n >= e, 1 where p.n <= e-FEATHER */
function ramp(nx,ny,e,feather){
  return g=>{ const a=g.createLinearGradient(nx*(e-feather),ny*(e-feather),nx*e,ny*e);
    a.addColorStop(0,'rgba(0,0,0,1)'); a.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=a; g.fillRect(0,0,1080,1080); };
}

function render(){
  ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
  ctx.fillStyle = BG; ctx.fillRect(0,0,L.w,L.h);
  /* light pool */
  const pc = {x:L.cx, y:L.cy}, R = L.poolR * P.pscale, pa = P.pool * (0.45 - 0.15 * P.dim);
  if (pa > 0){ const g = ctx.createRadialGradient(pc.x,pc.y,0,pc.x,pc.y,R);
    g.addColorStop(0, POOL); g.addColorStop(1, 'rgba(1,48,74,0)');
    ctx.globalAlpha = pa; ctx.fillStyle = g; ctx.fillRect(0,0,L.w,L.h); ctx.globalAlpha = 1; }
  ctx.fillStyle = ctx.createPattern(noise,'repeat'); ctx.fillRect(0,0,L.w,L.h);

  /* logo space */
  ctx.setTransform(L.s,0,0,L.s, L.cx - LOGO_C[0]*L.s, L.cy - LOGO_C[1]*L.s);
  if (NATIVE) ctx.setTransform(1,0,0,1,0,0);

  /* 1. light shapes: moving slanted light edge reveals them left to right; each settles 28 px as the edge reaches it */
  const e = P.edge;
  LIGHT.forEach(n=>{
    const b = PARTS[n].b, lead = proj(b[0],b[1]), trail = proj(b[2],b[3]);
    if (e <= lead) return;
    const dx = 28 * (1 - E.quartOut(clamp((e - lead) / 260)));
    const done = e - FEATHER >= trail + 28;           // fully revealed: draw without mask (exact pixels)
    drawPart(n, dx, 0, 1, done ? null : ramp(C,S,e,FEATHER));
  });
  /* 2. orange wedge: second slanted edge, top to bottom, expo out */
  if (P.wedge > 0){
    const b = PARTS.v_wedge.b, p = P.wedge;
    const lo = Math.min(projM(b[0],b[1]),projM(b[2],b[1]),projM(b[0],b[3]),projM(b[2],b[3]));
    const hi = Math.max(projM(b[0],b[1]),projM(b[2],b[1]),projM(b[0],b[3]),projM(b[2],b[3]));
    const ee = lo + p * (hi - lo + 40);
    drawPart('v_wedge', 0, -16 * (1 - p), p, p >= 1 ? null : ramp(-S,C,ee,40));
  }
  /* 3. STUDIO: same slanted edge, left to right, cubic out */
  if (P.studio > 0){
    const b = PARTS.studio.b, p = P.studio, lo = proj(b[0],b[1]), hi = proj(b[2],b[3]);
    drawPart('studio', 0, 0, p, p >= 1 ? null : ramp(C,S,lo + p * (hi - lo + 30),30));
  }
  ctx.setTransform(1,0,0,1,0,0);
}

window.seek = t => { tl.pause(); tl.time(Math.min(Math.max(t,0),DUR), false); render(); };
window.DUR = DUR;
window.seek(+(Q.get('t')||0));
/* capture tool: wait for __ready (document.fonts.ready is a no-op here, no live fonts) */
</script>
</body>
</html>
