<!doctype html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Journey & Reporting · Systronic</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#172b3b;font:16px/1.6 system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:24px}header,.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:28px;margin-bottom:4px}h2{font-size:20px}p{margin-top:4px}section,article{background:white;border:1px solid #ced6df;border-radius:10px;padding:18px;margin-block:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}label{display:grid;gap:5px;min-width:0}input,select{min-width:0;width:100%}main,section,.bar{min-width:0}#metadata,li,small{overflow-wrap:anywhere}input,select,button{font:inherit;border:1px solid #a4b2c1;border-radius:6px;padding:9px;max-width:100%}button{cursor:pointer;background:#124f79;color:white}button:disabled{opacity:.6;cursor:wait}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #db8900;outline-offset:3px}a{color:#124f79}.muted{color:#526476}.error{color:#9f1e19}#status{min-height:28px}article{overflow-wrap:anywhere}dl{display:grid;grid-template-columns:minmax(100px,1fr) 2fr;gap:8px}dd{margin:0;overflow-wrap:anywhere}ol{padding-inline-start:24px}li{margin-block:12px}summary{cursor:pointer;font-weight:600}#content{min-height:90px}small{display:block}.tag{font-size:14px;background:#e8f1f5;padding:4px 8px;border-radius:4px}.bar label{flex:1;min-width:130px}@media(max-width:600px){main{padding:14px}.grid{grid-template-columns:1fr}h1{font-size:23px}section,article{padding:12px}dl{grid-template-columns:1fr}dd{margin-bottom:8px}}
</style></head><body><main><header><div><a href="/" data-i="crm">CRM workspace</a><h1 data-i="title">Journey & Reporting</h1><p class="muted" data-i="intro">Internal evidence and deterministic attribution. Synthetic imports only.</p></div><button id="language" type="button">العربية</button></header>
<section><form id="connect"><div class="grid"><label><span data-i="token">Session token</span><input id="token" type="password" required autocomplete="off"></label><label><span data-i="tenant">Tenant ID</span><input id="tenant" required></label></div><p><button data-i="connect">Load reports</button></p></form></section>
<p id="status" role="status" aria-live="polite"></p>
<section id="workspace" hidden><div class="bar"><label><span data-i="view">View</span><select id="view"><option value="campaign" data-i="campaign">Campaign performance</option><option value="conversion" data-i="conversion">Conversions</option><option value="order" data-i="order">Orders / payments / refunds</option><option value="journey" data-i="journey">Contact journey</option></select></label><label><span data-i="model">Model</span><select id="model"><option value="first_touch" data-i="first_touch">First Touch</option><option value="last_non_direct" selected data-i="last_non_direct">Last Non-Direct Touch</option></select></label><label><span data-i="days">Lookback days</span><input id="days" type="number" min="1" max="365" value="30"></label></div>
<p class="bar"><button id="refresh" data-i="refresh">Refresh</button><button id="calculate" data-i="calculate">Publish calculation</button></p>
<label id="contactLabel" hidden><span data-i="contact">Contact</span><select id="contact"></select></label><p id="metadata" class="muted"></p><div id="content"></div><button id="more" hidden data-i="more">Load more</button></section></main>
<script>
const words={en:{crm:'CRM workspace',title:'Journey & Reporting',intro:'Internal evidence and deterministic attribution. Synthetic imports only.',token:'Session token',tenant:'Tenant ID',connect:'Load reports',view:'View',campaign:'Campaign performance',conversion:'Conversions',order:'Orders / payments / refunds',journey:'Contact journey',model:'Model',first_touch:'First Touch',last_non_direct:'Last Non-Direct Touch',days:'Lookback days',refresh:'Refresh',calculate:'Publish calculation',contact:'Contact',more:'Load more',loading:'Loading…',empty:'No evidence available for this view.',denied:'Permission denied. Check your current membership and role.',error:'Unable to load. Check the input and retry.',unknown:'Unknown / unattributed',internal:'Internal rule-based attribution',basis:'Conversion occurrence · UTC · all received evidence',provider:'Provider-reported attribution: not connected',stale:'Workers publish new runs after late events, imports or identity corrections. Refresh to see the latest run.',run:'Run / as of',currency:'Currency',value:'Value (minor units)',outcomes:'Outcomes',type:'Outcome',source:'Source',detail:'Details',payments:'Payments',refunds:'Refunds',fulfillment:'Fulfillment',spend:'Synthetic cost snapshots · account-local reporting dates',saved:'Loaded.',version:'Version',status:'Status',occurred:'Occurred',received:'Received',unpublished:'No calculation published',payment_captured:'Payment captured',refund_recorded:'Refund recorded',deal_won:'Deal won',order_placed:'Order placed',order_delivered:'Order delivered',page_view:'Page view',form_submitted:'Form submitted'},ar:{crm:'مساحة إدارة العملاء',title:'رحلة العميل والتقارير',intro:'أدلة داخلية وإسناد محدد القواعد. استيراد بيانات تجريبية فقط.',token:'رمز الجلسة',tenant:'معرّف المؤسسة',connect:'تحميل التقارير',view:'العرض',campaign:'أداء الحملات',conversion:'التحويلات',order:'الطلبات والمدفوعات والاسترداد',journey:'رحلة جهة الاتصال',model:'نموذج الإسناد',first_touch:'أول تفاعل',last_non_direct:'آخر تفاعل غير مباشر',days:'نافذة الإسناد بالأيام',refresh:'تحديث',calculate:'نشر حساب الإسناد',contact:'جهة الاتصال',more:'تحميل المزيد',loading:'جارٍ التحميل…',empty:'لا توجد أدلة متاحة لهذا العرض.',denied:'الوصول مرفوض. راجع العضوية والصلاحيات الحالية.',error:'تعذر التحميل. راجع المدخلات وأعد المحاولة.',unknown:'غير معروف / غير منسوب',internal:'إسناد داخلي محدد القواعد',basis:'تاريخ التحويل · UTC · جميع الأدلة المستلمة',provider:'إسناد المنصات: غير متصل',stale:'تُنشر حسابات جديدة بعد الأحداث المتأخرة أو الاستيراد أو تصحيح الهوية. حدّث العرض لمشاهدة أحدث حساب.',run:'الحساب / وقت النشر',currency:'العملة',value:'القيمة بأصغر وحدة نقدية',outcomes:'النتائج',type:'النتيجة',source:'المصدر',detail:'التفاصيل',payments:'المدفوعات',refunds:'الاسترداد',fulfillment:'التنفيذ والتسليم',spend:'تكاليف تجريبية · تواريخ التقارير بتوقيت الحساب',saved:'تم التحميل.',version:'الإصدار',status:'الحالة',occurred:'وقت الحدث',received:'وقت الاستلام',unpublished:'لم يُنشر حساب بعد',payment_captured:'تحصيل دفعة',refund_recorded:'تسجيل استرداد',deal_won:'صفقة رابحة',order_placed:'إنشاء طلب',order_delivered:'تسليم طلب',page_view:'عرض صفحة',form_submitted:'إرسال نموذج'}};
const $=id=>document.getElementById(id),node=(tag,text)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n;};let lang='en',cursor=null,busy=false,connected=false;const t=k=>words[lang][k]||k;
function translate(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.querySelectorAll('[data-i]').forEach(n=>n.textContent=t(n.dataset.i));$('language').textContent=lang==='en'?'العربية':'English';if(connected)run(()=>load());}
function message(s,error=false){$('status').textContent=s;$('status').className=error?'error':'';}
async function api(path,body){const r=await fetch('/v1/'+path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+$('token').value,'X-Tenant-ID':$('tenant').value,...(body?{'Content-Type':'application/json','Idempotency-Key':crypto.randomUUID()}:{})},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw new Error(t(r.status===401||r.status===403?'denied':'error'));return d;}
async function run(fn){if(busy)return;busy=true;message(t('loading'));$('content').setAttribute('aria-busy','true');document.querySelectorAll('button,select').forEach(n=>n.disabled=true);try{await fn();message(t('saved'));}catch(e){$('content').replaceChildren();message(e.message||t('error'),true);}finally{busy=false;document.querySelectorAll('button,select').forEach(n=>n.disabled=false);$('content').setAttribute('aria-busy','false');}}
function pair(dl,key,value){dl.append(node('dt',t(key)),node('dd',value===null||value===undefined?'—':String(value)));}
function card(title,pairs){const a=node('article');a.append(node('h2',title));const dl=node('dl');for(const [k,v] of pairs)pair(dl,k,v);a.append(dl);return a;}
function timeLine(label,value){const n=node('small',t(label)+': '),v=node('bdi',value);v.dir='ltr';n.append(v);return n;}function empty(){if(!$('content').children.length)$('content').append(node('p',t('empty')));}
async function load(append=false){if(!append){$('content').replaceChildren();cursor=null;}$('more').hidden=true;const view=$('view').value;$('contactLabel').hidden=view!=='journey';$('metadata').textContent='';
 if(view==='campaign'){const {data:d}=await api('reports/campaign-performance?model='+$('model').value);$('metadata').textContent=[t('internal'),t(d.model),t('version')+': '+d.version,t('days')+': '+d.lookback_days,t('basis'),t('run')+': '+(d.run_id?d.run_id+' / '+d.as_of:t('unpublished')),t('provider'),t('stale')].join(' · ');for(const r of d.rows)$('content').append(card(r.campaign_id==='unknown'?t('unknown'):(r.campaign_name||r.campaign_id),[['source',r.source],['type',t(r.conversion_type)],['value',r.value_minor],['currency',r.currency],['outcomes',r.outcomes]]));for(const s of d.spend)$('content').append(card(s.name,[['source',t('spend')],['value',s.spend_minor],['currency',s.currency],['occurred',s.reporting_date+' / '+s.timezone]]));
 }else if(view==='journey'){if(!$('contact').options.length){let next=null;do{const d=await api('contacts'+(next?'?cursor='+next:''));for(const c of d.data){const option=node('option',c.display_name);option.value=c.id;$('contact').append(option);}next=d.next_cursor;}while(next);}if($('contact').value){const d=await api('contacts/'+$('contact').value+'/journey'+(cursor?'?cursor='+cursor:''));const ol=node('ol');for(const e of [...d.data].sort((a,b)=>a.occurred_at.localeCompare(b.occurred_at))){const li=node('li',t(e.name));li.append(timeLine('occurred',e.occurred_at),timeLine('received',e.received_at));ol.append(li);}if(d.data.length)$('content').append(ol);cursor=d.next_cursor;}
 }else{const path=view==='conversion'?'conversions':'journey/orders',d=await api(path+(cursor?'?cursor='+cursor:''));cursor=d.next_cursor;for(const r of d.data){const a=card(t(r.conversion_type||'order'),[['detail',r.id],['type',t(r.conversion_type||r.order_status)],['value',r.value_minor??r.net_minor],['currency',r.currency],['occurred',r.occurred_at??r.placed_at]]);const button=node('button',t('detail'));button.onclick=()=>run(async()=>{const {data:x}=await api(path+'/'+r.id);let detail=a.querySelector('.details');if(detail)detail.remove();detail=node('div');detail.className='details';if(view==='order'){for(const [key,label] of [['payment','payments'],['refund','refunds'],['fulfillment','fulfillment']]){detail.append(node('h3',t(label)));for(const item of x[key])detail.append(node('p',(item.amount_minor??item.status)+' '+(item.currency??'')+' · '+item.occurred_at));if(!x[key].length)detail.append(node('p',t('empty')));}}else{for(const c of x.credits)detail.append(node('p',t(c.model)+' · '+(c.source==='unknown'?t('unknown'):c.source)+' · '+c.model_version+' · '+c.lookback_days+' · '+c.as_of));if(!x.credits.length)detail.append(node('p',t('unpublished')));}a.append(detail);});a.append(button);$('content').append(a);}}
 $('more').hidden=!cursor;empty();}
$('connect').onsubmit=e=>{e.preventDefault();run(async()=>{await load();connected=true;$('workspace').hidden=false;});};$('language').onclick=()=>{lang=lang==='en'?'ar':'en';translate();};$('view').onchange=$('model').onchange=$('contact').onchange=$('refresh').onclick=()=>run(()=>load());$('more').onclick=()=>run(()=>load(true));$('calculate').onclick=()=>run(async()=>{await api('journey/calculate',{lookback_days:Number($('days').value)});await load();});translate();
</script></body></html>
