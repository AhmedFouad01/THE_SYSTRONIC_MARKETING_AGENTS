<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Systronic CRM</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#172b3b;font:16px/1.6 system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:24px}header,.bar,nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap}header{justify-content:space-between}h1{font-size:26px}h2{font-size:21px}section,article{background:white;border:1px solid #cbd5df;border-radius:10px;padding:20px;margin-block:18px}label{display:block;font-weight:600}input,select,textarea,button{font:inherit;min-height:44px;border:1px solid #718294;border-radius:5px;padding:8px;max-width:100%}input,select,textarea{width:100%;background:white;color:#172b3b}button{background:#184d73;color:white;cursor:pointer}button.secondary{background:white;color:#184d73}button:disabled{opacity:.55;cursor:wait}:focus-visible{outline:3px solid #b55d00;outline-offset:3px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card strong{font-size:28px;display:block}.muted{color:#526171}.table{overflow:auto}table{border-collapse:collapse;width:100%;text-align:start}td,th{padding:12px;border-bottom:1px solid #d8e0e6;text-align:start;overflow-wrap:anywhere}output{display:block;padding:12px;overflow-wrap:anywhere}[hidden]{display:none!important}#status.error{color:#8d1721;background:#fff0f0}#status{min-height:48px}nav button[aria-current=true]{background:#102f48;border:3px solid #d2952c}details{margin-block:15px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}.tag{font-size:13px;background:#e6eef5;padding:4px 8px;border-radius:4px}form button{margin-block-start:16px}@media(max-width:600px){main{padding:14px}.grid,.cards{grid-template-columns:1fr}section,article{padding:14px}h1{font-size:22px}td,th{padding:8px}nav{gap:6px}nav button{font-size:14px}}
</style></head><body><a href="/reporting" style="display:block;padding:12px 24px">رحلة العميل والتقارير / Journey &amp; Reporting</a><main><header><h1>Systronic CRM</h1><button id="language" class="secondary">English</button></header><p id="intro"></p>
<section id="login"><form id="connect"><div class="grid"><label><span data-i="token"></span><input id="token" type="password" autocomplete="off" required></label><label><span data-i="tenant"></span><input id="tenant" dir="ltr" required></label><label><span data-i="grant"></span><input id="grant" dir="ltr"></label></div><button data-i="connect"></button></form></section>
<output id="status" role="status" aria-live="polite"></output><div id="workspace" hidden><nav id="nav" aria-label="CRM"></nav><section><div class="bar"><h2 id="heading"></h2><button id="refresh" class="secondary" data-i="refresh"></button><button id="new" data-i="new"></button><select id="due" hidden><option value="" data-i="all"></option><option value="overdue" data-i="overdue"></option><option value="today" data-i="due"></option></select></div><div id="content"></div><button id="more" hidden data-i="more"></button></section><section id="editor" hidden><h2 id="editTitle"></h2><form id="editForm"><div id="fields" class="grid"></div><button id="save" data-i="save"></button><button id="cancel" type="button" class="secondary" data-i="cancel"></button></form></section><section id="detail" hidden></section><section id="config" hidden><h2 data-i="config"></h2><p data-i="synthetic"></p><form id="pipelineForm"><label><span data-i="name"></span><input id="pipelineName" required value="Synthetic reference"></label><button data-i="reference"></button></form><form id="automationForm"><div class="grid"><label><span data-i="stage"></span><select id="ruleStage"></select></label><label><span data-i="title"></span><input id="ruleTitle" required></label><label><span data-i="minutes"></span><input id="ruleMinutes" type="number" min="0" max="525600" value="1440" required></label></div><button data-i="addRule"></button></form><div id="rules"></div></section></div></main>
<script>
const dict={ar:{intro:'مساحة عمل CRM داخلية · بيانات تجريبية محلية',token:'رمز الجلسة',tenant:'معرّف مساحة العمل',grant:'معرّف التفويض (اختياري)',connect:'فتح مساحة العمل',overview:'قائمة العمل',contacts:'جهات الاتصال',leads:'الاستفسارات',deals:'الصفقات والمراحل',tasks:'المتابعات',audit:'سجل التدقيق',outbox:'حالة المعالجة',refresh:'تحديث',new:'إضافة',save:'حفظ',cancel:'إلغاء',all:'كل المهام',overdue:'متأخرة',due:'مستحقة خلال 24 ساعة',more:'المزيد',empty:'لا توجد سجلات متاحة.',loading:'جارٍ التحميل…',forbidden:'لا تملك صلاحية هذا الإجراء. تحقق من العضوية والتفويض والمصادقة.',conflict:'تغيّر السجل منذ فتحه. حدّث البيانات ثم راجع التعديل.',failed:'تعذر إكمال الطلب. تحقق من الحقول ثم أعد المحاولة.',network:'تعذر الاتصال. إعادة المحاولة تحفظ هوية الأمر.',saved:'تم الحفظ.',name:'الاسم',title:'العنوان / الإجراء التالي',owner_id:'المسؤول',source:'المصدر',source_evidence:'دليل المصدر اليدوي',contact_id:'جهة الاتصال',lead_id:'الاستفسار (اختياري)',pipeline_id:'مسار البيع',stage_id:'المرحلة',amount_minor:'القيمة بوحدات العملة الصغرى',currency:'العملة',due_at:'موعد المتابعة',status:'الحالة',outcome:'نتيجة المتابعة',display_name:'اسم جهة الاتصال',email:'البريد الإلكتروني',phone:'الهاتف الدولي',detail:'تفاصيل',version:'الإصدار',history:'تاريخ المراحل',journey:'سجل جهة الاتصال',duplicates:'مراجعة التطابق',merge:'معاينة دمج صريح',confirmMerge:'تنفيذ الدمج المراجع',reason:'سبب الانتقال / سبب الخسارة',move:'نقل المرحلة',stage:'المرحلة',complete:'إكمال المهمة',edit:'تعديل',config:'إعداد المسار والمتابعة',synthetic:'المسار المرجعي تجريبي: جديد ← مؤهل ← فوز/خسارة، مع إعادة فتح. يمكن إنشاء مسارات مخصصة عبر API.',reference:'إنشاء مسار مرجعي تجريبي',minutes:'التأخير بالدقائق',addRule:'إضافة متابعة لهذه المرحلة',disable:'تعطيل',enable:'تفعيل',open:'مفتوحة',completed:'مكتملة',qualified:'مؤهل',closed:'مغلق',select:'اختر',count:'سجل في الصفحة',retry:'إعادة المحاولة',noSensitive:'البيانات الحساسة تظهر حسب الصلاحية.'},en:{intro:'Internal CRM workspace · local synthetic data',token:'Session token',tenant:'Workspace ID',grant:'Grant ID (optional)',connect:'Open workspace',overview:'Work queue',contacts:'Contacts',leads:'Leads',deals:'Deals / pipeline',tasks:'Follow-ups',audit:'Audit',outbox:'Processing status',refresh:'Refresh',new:'Add record',save:'Save',cancel:'Cancel',all:'All tasks',overdue:'Overdue',due:'Due in 24 hours',more:'Load more',empty:'No accessible records.',loading:'Loading…',forbidden:'Permission denied. Check membership, grant and authentication.',conflict:'This record changed after you opened it. Refresh and review your change.',failed:'Request failed. Check the fields and retry.',network:'Connection failed. Retry preserves the command identity.',saved:'Saved.',name:'Name',title:'Title / next action',owner_id:'Owner',source:'Source',source_evidence:'Manual source evidence',contact_id:'Contact',lead_id:'Lead (optional)',pipeline_id:'Pipeline',stage_id:'Stage',amount_minor:'Amount in minor units',currency:'Currency',due_at:'Follow-up due',status:'Status',outcome:'Follow-up outcome',display_name:'Contact name',email:'Email',phone:'International phone',detail:'Details',version:'Version',history:'Stage history',journey:'Contact timeline',duplicates:'Review matches',merge:'Preview explicit merge',confirmMerge:'Execute reviewed merge',reason:'Transition / loss reason',move:'Move stage',stage:'Stage',complete:'Complete task',edit:'Edit',config:'Pipeline and follow-up configuration',synthetic:'Synthetic reference: New → Qualified → Won/Lost, with reopening. Custom pipelines are supported through the API.',reference:'Create synthetic reference pipeline',minutes:'Delay in minutes',addRule:'Add stage follow-up',disable:'Disable',enable:'Enable',open:'Open',completed:'Completed',qualified:'Qualified',closed:'Closed',select:'Choose',count:'records on this page',retry:'Retry',noSensitive:'Sensitive fields appear according to permission.'}};
const $=id=>document.getElementById(id);let lang='ar',view='overview',session={},pipelines=[],assignees=[],rows=[],cursor=null,editing=null,preview=null;const pending=new Map();const t=k=>dict[lang][k]||k;
function node(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;}function button(label,fn){const b=node('button',label);b.type='button';b.onclick=fn;return b;}function status(message,error=false){$('status').textContent=message;$('status').className=error?'error':'';}
function translate(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';$('language').textContent=lang==='ar'?'English':'العربية';document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));$('intro').textContent=t('intro');nav();if(!$('workspace').hidden)load();}
$('language').onclick=()=>{lang=lang==='ar'?'en':'ar';translate();};
async function api(path,method='GET',body){const headers={Authorization:'Bearer '+$('token').value,'X-Tenant-ID':$('tenant').value};if($('grant').value)headers['X-Grant-ID']=$('grant').value;let fingerprint;if(body){fingerprint=method+path+JSON.stringify(body);if(!pending.has(fingerprint))pending.set(fingerprint,crypto.randomUUID());body={...body,command_id:pending.get(fingerprint)};headers['Idempotency-Key']=body.command_id;headers['Content-Type']='application/json';}let r,d;try{r=await fetch('/v1/'+path,{method,headers,body:body?JSON.stringify(body):undefined});d=await r.json();}catch{throw new Error(t('network'));}if(!r.ok)throw new Error((r.status===401||r.status===403?t('forbidden'):r.status===409?t('conflict'):t('failed'))+' ['+d.code+']');if(fingerprint)pending.delete(fingerprint);return d;}
async function run(fn){status(t('loading'));try{await fn();status(t('saved'));}catch(e){status(e.message,true);}}
function nav(){const n=$('nav');n.replaceChildren();for(const k of ['overview','contacts','leads','deals','tasks',...(session.audit?['audit','outbox']:[])]){const b=button(t(k),()=>{view=k;nav();load();});b.setAttribute('aria-current',String(view===k));n.append(b);}}
async function refs(){[pipelines,assignees]=await Promise.all([api('pipelines').then(x=>x.data),api('assignees').then(x=>x.data)]);$('ruleStage').replaceChildren(...pipelines.flatMap(p=>p.stages.map(s=>{const o=node('option',p.name+' / '+s.name);o.value=s.id;return o;})));}
$('connect').onsubmit=e=>{e.preventDefault();run(async()=>{session=(await api('session')).data;await refs();$('workspace').hidden=false;$('config').hidden=!session.configure;nav();await load();});};
function stageName(id){return pipelines.flatMap(p=>p.stages).find(s=>s.id===id)?.name||id;}
function table(items,columns,onOpen){if(!items.length)return node('p',t('empty'),'muted');const wrap=node('div',undefined,'table'),table=node('table'),head=node('tr');for(const c of columns)head.append(node('th',t(c)));if(onOpen)head.append(node('th',t('detail')));table.append(head);for(const r of items){const tr=node('tr');for(const c of columns){let value=r[c];if(c==='stage_id')value=stageName(value);if(c==='owner_id')value=assignees.find(a=>a.id===value)?.name||value;if(c==='due_at')value=new Date(value).toLocaleString(lang);tr.append(node('td',value===null||value===undefined?'—':t(String(value))));}if(onOpen){const td=node('td');td.append(button(t('detail'),()=>onOpen(r)));tr.append(td);}table.append(tr);}wrap.append(table);return wrap;}
async function load(more=false){status(t('loading'));$('heading').textContent=t(view);$('new').hidden=!['contacts','leads','deals','tasks'].includes(view);$('due').hidden=view!=='tasks';$('editor').hidden=true;$('detail').hidden=true;try{if(view==='overview'){const results=await Promise.all(['contacts','leads','deals','tasks?due=overdue'].map(apiPath=>api(apiPath)));const cards=node('div',undefined,'cards');for(const [i,k]of ['contacts','leads','deals','overdue'].entries()){const c=node('article',t(k),'card');c.append(node('strong',String(results[i].data.length)+(results[i].next_cursor?'+':'')));cards.append(c);}$('content').replaceChildren(cards,node('p',t('overdue')),table(results[3].data,['title','due_at','status'],r=>{view='tasks';nav();detail(r);}));$('more').hidden=true;}else{const q=new URLSearchParams();if(more&&cursor)q.set('cursor',cursor);if(view==='tasks'&&$('due').value)q.set('due',$('due').value);const d=await api(view+'?'+q);rows=more?rows.concat(d.data):d.data;cursor=d.next_cursor;$('more').hidden=!cursor;const cols=view==='contacts'?['display_name','source','version']:view==='deals'?['title','stage_id','owner_id','version']:view==='tasks'?['title','due_at','status','owner_id']:view==='leads'?['title','source','status','owner_id']:view==='audit'?['action','object_kind','occurred_at']:['status','attempts','error_code'];$('content').replaceChildren(table(rows,cols,['audit','outbox'].includes(view)?null:detail));}if(session.configure)await rules();status('');}catch(e){status(e.message,true);$('content').replaceChildren(button(t('retry'),()=>load()));}}
$('refresh').onclick=()=>run(async()=>{await refs();await load();});$('more').onclick=()=>load(true);$('due').onchange=()=>load();$('new').onclick=()=>editor();$('cancel').onclick=()=>{$('editor').hidden=true;};
function field(name,type='text',value='',options){const label=node('label',t(name)),input=node(options?'select':type==='textarea'?'textarea':'input');input.name=name;input.id='field-'+name;if(!options)input.type=type;if(options){const empty=node('option',t('select'));empty.value='';input.append(empty);for(const o of options){const option=node('option',o.name||o.title||o.display_name);option.value=o.id;input.append(option);}}input.value=value??'';if(!['lead_id','email','phone','outcome'].includes(name))input.required=true;label.append(input);$('fields').append(label);return input;}
async function editor(r=null){editing=r;$('editor').hidden=false;$('editTitle').textContent=t(r?'edit':'new')+' · '+t(view);$('fields').replaceChildren();try{if(view==='contacts'){field('display_name','text',r?.display_name);if(!r)field('source','text','manual');field('email','email');field('phone','tel');}else{field('title','text',r?.title);if(!r){const contacts=(await api('contacts')).data;field('contact_id','text','',contacts);if(view==='leads')field('source_evidence','textarea');if(view==='deals'){field('lead_id','text','',(await api('leads')).data);const p=field('pipeline_id','text','',pipelines),s=field('stage_id','text','',[]);p.onchange=()=>{s.replaceChildren(...(pipelines.find(x=>x.id===p.value)?.stages.filter(x=>!x.outcome)||[]).map(x=>{const o=node('option',x.name);o.value=x.id;return o;}));};}}if(view==='deals'){field('amount_minor','number',r?.amount_minor??0).min='0';field('currency','text',r?.currency??'EGP');}if(view==='tasks'){field('due_at','datetime-local',r?new Date(new Date(r.due_at).getTime()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16):'');field('outcome','text',r?.outcome);}if(r&&['tasks','leads'].includes(view))field('status','text',r.status,(view==='tasks'?['open','completed']:['open','qualified','closed']).map(x=>({id:x,name:t(x)})));}field('owner_id','text',r?.owner_id??session.actor,assignees);$('editor').scrollIntoView({block:'start'});}catch(e){status(e.message,true);}}
$('editForm').onsubmit=e=>{e.preventDefault();run(async()=>{const b=Object.fromEntries(new FormData(e.target));if(b.amount_minor!==undefined)b.amount_minor=Number(b.amount_minor);if(b.due_at)b.due_at=new Date(b.due_at).toISOString();if(!b.lead_id)delete b.lead_id;if(!b.outcome)delete b.outcome;if(view==='contacts'){b.identifiers=['email','phone'].filter(k=>b[k]).map(k=>({kind:k,value:b[k],provenance:'manual'}));delete b.email;delete b.phone;if(!b.identifiers.length)delete b.identifiers;}if(editing)b.expected_version=editing.version;await api(view+(editing?'/'+editing.id:''),editing?'PATCH':'POST',b);await load();});};
async function detail(row){run(async()=>{const r=(await api(view+'/'+row.id)).data,d=$('detail');d.hidden=false;d.replaceChildren(node('h2',r.display_name||r.title),button(t('edit'),()=>editor(r)));const summary=node('dl');for(const key of ['display_name','title','source','source_evidence','owner_id','stage_id','amount_minor','currency','status','due_at','outcome','version']){if(r[key]===undefined||r[key]===null)continue;summary.append(node('dt',t(key)),node('dd',key==='owner_id'?(assignees.find(a=>a.id===r[key])?.name||'—'):key==='stage_id'?stageName(r[key]):key==='due_at'?new Date(r[key]).toLocaleString(lang):t(String(r[key]))));}for(const item of r.identifiers||[])summary.append(node('dt',t(item.kind)),node('dd',item.value));d.append(summary);
if(view==='deals'){const f=node('form'),label=node('label',t('stage')),select=node('select');select.required=true;const p=pipelines.find(p=>p.id===r.pipeline_id);for(const edge of p?.transitions.filter(x=>x.from_stage===r.stage_id)||[]){const o=node('option',stageName(edge.to_stage));o.value=edge.to_stage;select.append(o);}label.append(select);const reason=node('input');reason.placeholder=t('reason');reason.setAttribute('aria-label',t('reason'));reason.required=true;const submit=node('button',t('move'));f.append(label,reason,submit);f.onsubmit=e=>{e.preventDefault();run(async()=>{await api('deals/'+r.id+'/transitions','POST',{to_stage_id:select.value,expected_version:r.version,reason:reason.value});await load();await detail(r);});};d.append(f,node('h3',t('history')),table((await api('deals/'+r.id+'/history')).data,['from_stage','to_stage','reason','deal_version']));}
if(view==='tasks'&&r.status==='open')d.append(button(t('complete'),()=>run(async()=>{await api('tasks/'+r.id,'PATCH',{expected_version:r.version,status:'completed'});await load();})));
if(view==='contacts'){d.append(node('h3',t('journey')),table((await api('contacts/'+r.id+'/journey')).data,['action','occurred_at']));if(session.merge)d.append(button(t('duplicates'),()=>run(async()=>{const matches=(await api('contacts/'+r.id+'/duplicates')).data;d.append(table(matches,['display_name'],candidate=>run(async()=>{preview=(await api('contacts/merge-previews','POST',{source_id:r.id,target_id:candidate.id})).data;d.append(node('pre',JSON.stringify(preview,null,2)),button(t('confirmMerge'),()=>run(async()=>{await api('contacts/merges','POST',{source_id:preview.source_id,target_id:preview.target_id,source_version:preview.source_version,target_version:preview.target_version});await load();})));})));})));}d.scrollIntoView({block:'start'});});}
// Preview has no durable effect and therefore omits command_id from its contract.
const originalApi=api;api=async function(path,method='GET',body){if(path!=='contacts/merge-previews')return originalApi(path,method,body);const headers={Authorization:'Bearer '+$('token').value,'X-Tenant-ID':$('tenant').value,'Content-Type':'application/json','Idempotency-Key':crypto.randomUUID()};if($('grant').value)headers['X-Grant-ID']=$('grant').value;const r=await fetch('/v1/'+path,{method,headers,body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw new Error(t('failed')+' ['+d.code+']');return d;};
$('pipelineForm').onsubmit=e=>{e.preventDefault();run(async()=>{await api('pipelines','POST',{name:$('pipelineName').value,stages:[{name:'New'},{name:'Qualified'},{name:'Won',outcome:'won'},{name:'Lost',outcome:'lost'}],transitions:[[0,1],[1,2],[1,3],[2,1],[3,1]]});await refs();await load();});};
$('automationForm').onsubmit=e=>{e.preventDefault();run(async()=>{await api('automations','POST',{stage_id:$('ruleStage').value,title:$('ruleTitle').value,delay_minutes:Number($('ruleMinutes').value)});await rules();});};
async function rules(){const data=(await api('automations')).data;$('rules').replaceChildren(...data.map(r=>{const p=node('p',r.title+' · '+stageName(r.stage_id)+' ');p.append(button(t(r.enabled?'disable':'enable'),()=>run(async()=>{await api('automations/'+r.id,'PATCH',{enabled:!r.enabled});await rules();})));return p;}));}translate();
</script></body></html>
