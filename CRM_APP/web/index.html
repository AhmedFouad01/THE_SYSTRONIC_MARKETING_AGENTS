<!doctype html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRM · M0</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#18232e;font:16px/1.6 system-ui,sans-serif}main{max-width:860px;margin:40px auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:28px;margin:0}section{background:white;padding:24px;border:1px solid #d3dce4;border-radius:12px;margin-block:24px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;font-weight:600}input,button{font:inherit;max-width:100%;border-radius:6px;padding:10px;border:1px solid #778898}input{width:100%;background:#fff}button{cursor:pointer;background:#184d73;color:white;min-height:44px}button:disabled{opacity:.6}input:focus-visible,button:focus-visible{outline:3px solid #bc6b00;outline-offset:3px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-block-start:20px}output{display:block;overflow-wrap:anywhere;margin-block-start:16px}small{color:#526171}@media(max-width:540px){main{margin:0;padding:16px}section{padding:16px}.fields{grid-template-columns:1fr}h1{font-size:23px}}
</style></head><body><main><header><h1 data-en="Deal transition" data-ar="تغيير مرحلة الصفقة">Deal transition</h1><button id="language" type="button">العربية</button></header><p data-en="M0 foundation · synthetic data only" data-ar="إثبات الأساس M0 · بيانات تجريبية فقط">M0 foundation · synthetic data only</p>
<section><form id="form"><div class="fields">
<label><span data-en="Session token" data-ar="رمز الجلسة">Session token</span><input id="token" type="password" autocomplete="off" required></label>
<label><span data-en="Tenant ID" data-ar="معرّف المستأجر">Tenant ID</span><input id="tenant" required dir="ltr"></label>
<label><span data-en="Deal ID" data-ar="معرّف الصفقة">Deal ID</span><input id="deal" required dir="ltr"></label>
<label><span data-en="Target stage ID" data-ar="معرّف المرحلة التالية">Target stage ID</span><input id="stage" required dir="ltr"></label>
<label><span data-en="Expected version" data-ar="الإصدار المتوقع">Expected version</span><input id="version" type="number" min="0" value="0" required></label>
<label><span data-en="Reason" data-ar="السبب">Reason</span><input id="reason" maxlength="500" value="M0 synthetic proof"></label>
</div><div class="actions"><button id="load" type="button" data-en="Load deal" data-ar="تحميل الصفقة">Load deal</button><button id="submit" data-en="Move stage" data-ar="تغيير المرحلة">Move stage</button></div><output id="result" role="status" aria-live="polite" data-en="Enter the local fixture IDs to begin." data-ar="أدخل معرّفات البيانات التجريبية للبدء.">Enter the local fixture IDs to begin.</output></form></section><small data-en="One controlled transition. No provider integrations." data-ar="انتقال واحد مضبوط. دون تكاملات خارجية.">One controlled transition. No provider integrations.</small></main>
<script>
const $=id=>document.getElementById(id);let pending=null;
$('language').onclick=()=>{const ar=document.documentElement.lang!=='ar';document.documentElement.lang=ar?'ar':'en';document.documentElement.dir=ar?'rtl':'ltr';document.querySelectorAll('[data-en]').forEach(e=>e.textContent=e.dataset[ar?'ar':'en']);$('language').textContent=ar?'English':'العربية';};
async function send(move){const base={to_stage_id:$('stage').value,expected_version:Number($('version').value),reason:$('reason').value};const fingerprint=JSON.stringify([$('tenant').value,$('deal').value,base]);if(move&&(!pending||pending.fingerprint!==fingerprint))pending={fingerprint,command_id:crypto.randomUUID()};const headers={'Authorization':'Bearer '+$('token').value,'X-Tenant-ID':$('tenant').value};if(move){headers['Content-Type']='application/json';headers['Idempotency-Key']=pending.command_id;}$('submit').disabled=true;try{const r=await fetch('/v1/deals/'+encodeURIComponent($('deal').value)+(move?'/transitions':''),{method:move?'POST':'GET',headers,body:move?JSON.stringify({...base,command_id:pending.command_id}):undefined});const data=await r.json();$('result').textContent=JSON.stringify(data);if(r.ok){$('version').value=data.data.version;if(move)pending=null;}}catch{$('result').textContent=document.documentElement.lang==='ar'?'تعذر الاتصال. أعد المحاولة بنفس الأمر.':'Connection failed. Retry the same command.';}finally{$('submit').disabled=false;}}
$('load').onclick=()=>send(false);$('form').onsubmit=e=>{e.preventDefault();send(true);};
</script></body></html>
