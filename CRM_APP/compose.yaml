services:
  postgres:
    image: postgres:17.10-bookworm
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env first}
      POSTGRES_DB: crm_m0
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["m0-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crm_m0"]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  m0-data:
