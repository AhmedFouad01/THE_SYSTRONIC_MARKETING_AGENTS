name: TSST spine

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  spine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TSST_NO_DRIVE: "1"   # .gdoc stubs are Drive-only; exports + hashes are still checked
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Client work is not in git (R48), so TSST/brands does not exist on the runner. The validator and
      # the bus check report what they could not look at as SKIP with the reason; SKIP is never PASS.
      # The full set runs on a workstation that has the client folders.
      # Every step runs even when an earlier one failed, so one failure never hides the state of the rest.
      - name: Spine validator
        run: python TSST/context/tests/validate_spine.py
      - name: Bus regression tests
        if: ${{ !cancelled() }}
        run: python TSST/context/tests/test_bus.py
      - name: Bus queue check
        if: ${{ !cancelled() }}
        run: python TSST/bus/bus.py check
      - name: Context OS reference tests
        if: ${{ !cancelled() }}
        run: |
          for d in TSST/context_os/reference/*/; do
            echo "== $d"
            (cd "$d" && python -m unittest discover -s tests -q)
          done
